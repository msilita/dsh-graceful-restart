# dsh-graceful-restart bundle patch —— 挂载 host 半（client 半经 dsh.client 清单被 client-modules 扫描发现）。
# webserver 端口按代际条件化（"自动套壳"）：
#   第一代（用户直接 dsh web，无 DSH_LAUNCHER_WRAPPER）：port 0 = OS 随机分配，
#     不占用任何固定端口（不作占位服务；职责仅是 spawn 第二代并常驻监听 IPC）
#   第二代+（wrapper 拉起，DSH_LAUNCHER_WRAPPER=1）：正常监听正式端口 3080
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '127.0.0.1'
    port: !!js "(process.env.DSH_LAUNCHER_WRAPPER === '1') ? 3080 : 0"

- insert:
    - id: dsh-graceful-restart
      name: dsh-graceful-restart
      config: {}

# 业务插件按代际条件禁用（与 webserver 端口同一 !!js 机制）：
#   第一代（用户直接 dsh web，无 DSH_LAUNCHER_WRAPPER）→ disabled=true → 根本不加载
#     （第一代零业务插件：无双 bot 连接/双定时器，无需运行时拆树，无 boot 校验冲突）
#   第二代+（wrapper 拉起，DSH_LAUNCHER_WRAPPER=1）→ disabled=false → 正常加载
- id: dsh-qq-client
  disabled: !!js "process.env.DSH_LAUNCHER_WRAPPER !== '1'"
- id: dsh-waker-trigger
  disabled: !!js "process.env.DSH_LAUNCHER_WRAPPER !== '1'"
- id: dsh-better-sidebar
  disabled: !!js "process.env.DSH_LAUNCHER_WRAPPER !== '1'"
